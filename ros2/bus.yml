# ros2_canopen 버스 설정 예시 (Jetson Orin, slcan0)
#
# - EDS: eds/pico_ak40.eds 를 이 파일과 같은 config 폴더에 복사해서 사용
# - 키 이름과 기본값은 ros2_canopen 버전에 따라 다를 수 있으니 공식 문서와 대조할 것:
#   https://ros-industrial.github.io/ros2_canopen/manual/rolling/
# - 단위: 위치 0.0001 rad, 속도 0.001 rad/s -> scale_* 로 ROS 의 rad, rad/s 로 변환

options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 127
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  sync_period: 10000          # SYNC 주기 [us] = 100 Hz
  heartbeat_producer: 100     # 마스터 heartbeat [ms]

defaults:
  dcf: "pico_ak40.eds"
  driver: "ros2_canopen::Cia402Driver"
  package: "canopen_402_driver"
  period: 10
  heartbeat_producer: 500     # 슬레이브 heartbeat [ms] -> 0x1017
  heartbeat_consumer: true    # 슬레이브가 마스터 heartbeat 를 감시 -> 0x1016 (끊기면 0x6007 동작)
  scale_pos_to_dev: 10000.0   # rad -> 0.0001 rad
  scale_pos_from_dev: 0.0001
  scale_vel_to_dev: 1000.0    # rad/s -> 0.001 rad/s
  scale_vel_from_dev: 0.001
  sdo:
    - {index: 0x6081, sub_index: 0, value: 2000}    # Profile velocity 2 rad/s
    - {index: 0x6083, sub_index: 0, value: 10000}   # Profile acceleration 10 rad/s^2
  tpdo:
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6041, sub_index: 0}   # Statusword
        - {index: 0x6061, sub_index: 0}   # Modes of operation display
    2:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6064, sub_index: 0}   # Position actual value
        - {index: 0x606C, sub_index: 0}   # Velocity actual value
    3:
      enabled: false
    4:
      enabled: false
  rpdo:
    1:
      enabled: true
      cob_id: "auto"
      mapping:
        - {index: 0x6040, sub_index: 0}   # Controlword
        - {index: 0x6060, sub_index: 0}   # Modes of operation
    2:
      enabled: true
      cob_id: "auto"
      mapping:
        - {index: 0x607A, sub_index: 0}   # Target position
        - {index: 0x60FF, sub_index: 0}   # Target velocity

nodes:
  joint1:
    node_id: 1
  joint2:
    node_id: 2
  joint3:
    node_id: 3
